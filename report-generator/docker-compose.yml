version: "3.9"
services:
  traefik:
    image: docker.io/traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-administrator@hilase.cz}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-websupport}"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${ACME_DNS_RESOLVERS:-1.1.1.1:53,8.8.8.8:53}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      WEBSUPPORT_API_KEY: ${WEBSUPPORT_API_KEY}
      WEBSUPPORT_SECRET: ${WEBSUPPORT_SECRET}
      ACME_DOMAIN: ${ACME_DOMAIN:-raywrite.hilase.cz}
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro,Z
      - acme-data:/acme

  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./assets:/app/assets
      - ./configs:/app/configs
      - ./pdf:/app/pdf
      - ./services:/app/services
    restart: unless-stopped

volumes:
  acme-data: